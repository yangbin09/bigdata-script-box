<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('执行历史')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments :: sidebar('history')}"></div>
        <main class="col-md-10 py-3">
            <h4>执行历史</h4>
            <p class="text-muted small">点击「详情」查看 stdout / stderr 和参数。</p>
            <table class="table table-sm table-bordered bg-white">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>脚本</th><th>租户</th><th>参数</th>
                    <th>结果</th><th>Exit</th><th>Timeout</th>
                    <th>耗时(ms)</th><th>开始时间</th><th style="width:120px">操作</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </main>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header"><h5 id="d-title">详情</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div id="d-meta" class="small text-muted mb-2"></div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="text-muted small mb-1">stdout</div>
                        <pre class="log-box" id="d-stdout"></pre>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small mb-1">stderr</div>
                        <pre class="log-box" id="d-stderr"></pre>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
    function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    async function load() {
        const r = await fetch('/api/history?limit=200');
        const j = await r.json();
        const tbody = document.getElementById('rows');
        if (!j.data || j.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">暂无执行记录</td></tr>';
            return;
        }
        tbody.innerHTML = j.data.map(h => `
            <tr>
              <td>${h.id}</td>
              <td><code>${esc(h.scriptName)}</code></td>
              <td>${esc(h.tenantName)}</td>
              <td class="small"><code>${esc((h.parametersJson||'').slice(0,80))}${(h.parametersJson||'').length>80?'…':''}</code></td>
              <td>${h.success ? '<span class="badge bg-success">成功</span>' : '<span class="badge bg-danger">失败</span>'}</td>
              <td>${h.exitCode==null?'':h.exitCode}</td>
              <td>${h.timeout ? '<span class="badge bg-warning text-dark">是</span>' : '否'}</td>
              <td>${h.durationMs||0}</td>
              <td class="small text-muted">${esc((h.startTime||'').replace('T',' ').slice(0,19))}</td>
              <td><button class="btn btn-sm btn-outline-primary" onclick="show(${h.id})">详情</button></td>
            </tr>`).join('');
    }
    window.show = async function(id) {
        const r = await fetch('/api/history/' + id);
        const j = await r.json();
        const h = j.data;
        document.getElementById('d-title').textContent = `执行 #${h.id} · ${h.scriptName} · ${h.tenantName}`;
        document.getElementById('d-meta').textContent =
            `start=${h.startTime} · duration=${h.durationMs}ms · exit=${h.exitCode} · timeout=${h.timeout} · success=${h.success}`;
        document.getElementById('d-stdout').textContent = '加载中…';
        document.getElementById('d-stderr').textContent = '加载中…';
        modal.show();
        const [so, se] = await Promise.all([
            fetch('/api/executions/' + h.id + '/stdout').then(r => r.text()),
            fetch('/api/executions/' + h.id + '/stderr').then(r => r.text())
        ]);
        document.getElementById('d-stdout').textContent = so;
        document.getElementById('d-stderr').textContent = se;
    };
    load();
</script>
</body>
</html>
