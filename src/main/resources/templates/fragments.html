<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared chrome. We don't use the layout dialect because v3 has confusing edge cases
  with Thymeleaf 3.1 + Spring Boot 3.3. Inline is simpler for 4 pages.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'BigData Script Box'">BigData Script Box</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <style>
        body { padding-top: 56px; background: #f6f7f9; }
        .sidebar { background: #fff; border-right: 1px solid #e6e6e6; min-height: calc(100vh - 56px); padding-top: 1rem; }
        .sidebar a { display: block; padding: .55rem 1rem; color: #333; text-decoration: none; border-radius: .25rem; margin: 0 .5rem .25rem; }
        .sidebar a.active, .sidebar a:hover { background: #0d6efd; color: #fff; }
        .log-box { background: #1e1e1e; color: #d4d4d4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: .75rem; border-radius: .25rem; white-space: pre-wrap; max-height: 60vh; overflow: auto; }
        .script-card { cursor: pointer; }
        .script-card:hover { border-color: #0d6efd; }
        .badge-cat { font-weight: normal; }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">⚙ BigData Script Box</a>
        <span class="navbar-text text-white-50 small">H2 File DB · ProcessBuilder · Mock mode</span>
    </div>
</nav>
<div th:fragment="sidebar(active)" class="col-md-2 sidebar p-0">
    <a href="/" th:classappend="${active=='execute'} ? 'active' : ''">▶ 执行中心</a>
    <a href="/scripts" th:classappend="${active=='scripts'} ? 'active' : ''">📜 脚本管理</a>
    <a href="/tenants" th:classappend="${active=='tenants'} ? 'active' : ''">👥 租户管理</a>
    <a href="/history" th:classappend="${active=='history'} ? 'active' : ''">📚 执行历史</a>
    <hr/>
    <div class="px-3 text-muted small">
        <div>新增脚本/参数无需重新打包。</div>
        <div class="mt-2">程序只部署一次。</div>
    </div>
</div>
</body>
</html>
