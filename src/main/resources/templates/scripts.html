<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('脚本管理')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments :: sidebar('scripts')}"></div>
        <main class="col-md-10 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h4>脚本管理</h4>
                <a class="btn btn-primary btn-sm" href="/scripts/edit">+ 新增脚本</a>
            </div>
            <p class="text-muted small">新增脚本后无需重新打包 Java。脚本文件存于 <code>data/scripts/{id}/script.sh</code>。</p>
            <table class="table table-sm table-bordered bg-white">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>名称</th><th>显示名</th><th>分类</th><th>Timeout(s)</th>
                    <th>参数数</th><th>状态</th><th>描述</th><th style="width:280px">操作</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </main>
    </div>
</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    async function load() {
        const r = await fetch('/api/scripts');
        const j = await r.json();
        const tbody = document.getElementById('rows');
        if (!j.data || j.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">还没有脚本，点击右上角新增</td></tr>';
            return;
        }
        const counts = await Promise.all(j.data.map(async s => {
            const rr = await fetch('/api/scripts/' + s.id + '/params');
            const jj = await rr.json();
            return [s.id, (jj.data || []).length];
        }));
        const cmap = Object.fromEntries(counts);
        tbody.innerHTML = j.data.map(s => `
            <tr>
              <td>${s.id}</td>
              <td><code>${esc(s.name)}</code></td>
              <td>${esc(s.displayName||'')}</td>
              <td><span class="badge bg-secondary">${esc(s.category||'')}</span></td>
              <td>${s.timeoutSeconds}</td>
              <td>${cmap[s.id]||0}</td>
              <td>${s.enabled ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>'}</td>
              <td class="small text-muted">${esc(s.description||'')}</td>
              <td>
                <a class="btn btn-sm btn-outline-primary" href="/scripts/edit?id=${s.id}">编辑</a>
                <button class="btn btn-sm ${s.enabled?'btn-outline-warning':'btn-outline-success'}"
                        onclick="toggle(${s.id}, ${!s.enabled})">${s.enabled?'禁用':'启用'}</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${s.id})">删除</button>
              </td>
            </tr>`).join('');
    }
    function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    window.toggle = async function(id, en) {
        await fetch('/api/scripts/' + id + '/enabled?enabled=' + en, { method: 'POST' });
        load();
    };
    window.del = async function(id) {
        if (!confirm('删除脚本 #' + id + '?（同时删除脚本文件和参数）')) return;
        await fetch('/api/scripts/' + id, { method: 'DELETE' });
        load();
    };
    load();
</script>
</body>
</html>
