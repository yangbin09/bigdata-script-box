<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('租户管理')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments :: sidebar('tenants')}"></div>
        <main class="col-md-10 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h4>租户管理</h4>
                <button class="btn btn-primary btn-sm" id="btn-new">+ 新增租户</button>
            </div>
            <p class="text-muted small">租户表示脚本执行身份。Keytab 文件仅存磁盘，不入库。</p>
            <table class="table table-sm table-bordered bg-white">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>名称</th><th>Principal</th><th>默认库</th><th>Keytab</th>
                    <th>状态</th><th>描述</th><th style="width:300px">操作</th>
                </tr>
                </thead>
                <tbody id="tenant-rows"></tbody>
            </table>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 id="editModalTitle">新增租户</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="f-id"/>
                <div class="mb-2"><label class="form-label small">名称 *</label>
                    <input class="form-control form-control-sm" id="f-name"/></div>
                <div class="mb-2"><label class="form-label small">Principal</label>
                    <input class="form-control form-control-sm" id="f-principal" placeholder="hdfs@EXAMPLE.COM"/></div>
                <div class="mb-2"><label class="form-label small">默认数据库</label>
                    <input class="form-control form-control-sm" id="f-db"/></div>
                <div class="mb-2"><label class="form-label small">描述</label>
                    <textarea class="form-control form-control-sm" id="f-desc" rows="2"></textarea></div>
                <div class="mb-2"><label class="form-label small">启用</label>
                    <select id="f-enabled" class="form-select form-select-sm">
                        <option value="true">启用</option><option value="false">禁用</option>
                    </select></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary btn-sm" id="btn-save">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="keytabModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>上传 Keytab</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="kt-id"/>
                <div class="alert alert-info small">Keytab 二进制仅写入 <code>data/keytabs/</code>，不入 H2 数据库。</div>
                <input type="file" id="kt-file" class="form-control form-control-sm" accept=".keytab"/>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary btn-sm" id="btn-kt-upload">上传</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="testModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5>测试租户</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <pre class="log-box" id="test-output">执行中…</pre>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        const editModal = new bootstrap.Modal(document.getElementById('editModal'));
        const keytabModal = new bootstrap.Modal(document.getElementById('keytabModal'));
        const testModal = new bootstrap.Modal(document.getElementById('testModal'));

        async function load() {
            const r = await fetch('/api/tenants');
            const j = await r.json();
            const tbody = document.getElementById('tenant-rows');
            if (!j.data || j.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">还没有租户</td></tr>';
                return;
            }
            tbody.innerHTML = j.data.map(t => `
                <tr>
                  <td>${t.id}</td>
                  <td>${escape(t.name)}</td>
                  <td><code>${escape(t.principal||'')}</code></td>
                  <td>${escape(t.defaultDatabase||'')}</td>
                  <td>${t.keytabPath ? '已上传' : '<span class="text-muted">未上传</span>'}</td>
                  <td>${t.enabled ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>'}</td>
                  <td class="small text-muted">${escape(t.description||'')}</td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="editTenant(${t.id})">编辑</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="uploadKeytab(${t.id})">Keytab</button>
                    <button class="btn btn-sm btn-outline-info" onclick="testTenant(${t.id})">测试</button>
                    <button class="btn btn-sm ${t.enabled?'btn-outline-warning':'btn-outline-success'}"
                            onclick="toggleEnabled(${t.id}, ${!t.enabled})">${t.enabled?'禁用':'启用'}</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="delTenant(${t.id})">删除</button>
                  </td>
                </tr>`).join('');
        }
        function escape(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

        window.editTenant = async function(id) {
            if (id == null) {
                document.getElementById('editModalTitle').textContent = '新增租户';
                document.getElementById('f-id').value = '';
                document.getElementById('f-name').value = '';
                document.getElementById('f-principal').value = '';
                document.getElementById('f-db').value = '';
                document.getElementById('f-desc').value = '';
                document.getElementById('f-enabled').value = 'true';
            } else {
                const r = await fetch('/api/tenants/' + id);
                const j = await r.json();
                const t = j.data;
                document.getElementById('editModalTitle').textContent = '编辑租户 #' + id;
                document.getElementById('f-id').value = id;
                document.getElementById('f-name').value = t.name||'';
                document.getElementById('f-principal').value = t.principal||'';
                document.getElementById('f-db').value = t.defaultDatabase||'';
                document.getElementById('f-desc').value = t.description||'';
                document.getElementById('f-enabled').value = t.enabled?'true':'false';
            }
            editModal.show();
        };

        window.uploadKeytab = function(id) {
            document.getElementById('kt-id').value = id;
            document.getElementById('kt-file').value = '';
            keytabModal.show();
        };

        window.testTenant = async function(id) {
            document.getElementById('test-output').textContent = '执行中…';
            testModal.show();
            const r = await fetch('/api/tenants/' + id + '/test', { method: 'POST' });
            const j = await r.json();
            const out = j.code === 0
                ? '[ok=' + j.data.ok + ']\n--- kinit ---\n' + j.data.stdout + (j.data.klist?'\n--- klist ---\n'+j.data.klist:'')
                : 'ERROR: ' + j.message;
            document.getElementById('test-output').textContent = out;
        };

        window.toggleEnabled = async function(id, enabled) {
            await fetch('/api/tenants/' + id + '/enabled?enabled=' + enabled, { method: 'POST' });
            load();
        };

        window.delTenant = async function(id) {
            if (!confirm('确认删除租户 #' + id + '?')) return;
            await fetch('/api/tenants/' + id, { method: 'DELETE' });
            load();
        };

        document.getElementById('btn-new').addEventListener('click', () => editTenant(null));
        document.getElementById('btn-save').addEventListener('click', async () => {
            const id = document.getElementById('f-id').value;
            const body = {
                name: document.getElementById('f-name').value,
                principal: document.getElementById('f-principal').value,
                defaultDatabase: document.getElementById('f-db').value,
                description: document.getElementById('f-desc').value,
                enabled: document.getElementById('f-enabled').value === 'true'
            };
            const url = id ? '/api/tenants/' + id : '/api/tenants';
            const method = id ? 'PUT' : 'POST';
            const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const j = await r.json();
            if (j.code !== 0) return alert(j.message);
            editModal.hide(); load();
        });
        document.getElementById('btn-kt-upload').addEventListener('click', async () => {
            const id = document.getElementById('kt-id').value;
            const f = document.getElementById('kt-file').files[0];
            if (!f) return alert('请选择文件');
            const fd = new FormData();
            fd.append('file', f);
            const r = await fetch('/api/tenants/' + id + '/keytab', { method: 'POST', body: fd });
            const j = await r.json();
            if (j.code !== 0) return alert(j.message);
            keytabModal.hide(); load();
        });

        load();
    })();
</script>
</body>
</html>
