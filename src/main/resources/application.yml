server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: script-box
  datasource:
    url: jdbc:h2:file:./data/db/scriptbox;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: null

scriptbox:
  mock: true                       # dev server has no Kerberos / Hadoop; mock everything
  data-dir: ./data                 # tenant keytabs, scripts, executions
  scripts-dir: ./data/scripts      # uploaded shell scripts
  keytabs-dir: ./data/keytabs      # uploaded keytab files
  executions-dir: ./data/executions
  max-log-bytes: 1048576           # 1MB limit per page render
  max-script-bytes: 1048576        # 1MB script upload limit
  max-input-file-bytes: 10485760   # 10MB script parameter file upload limit
  max-artifact-bytes: 52428800     # 50MB per artifact file
  max-artifact-files: 50           # 50 artifacts per execution max
  max-artifact-total-bytes: 209715200  # 200MB total artifacts per execution
  # V2: manual cleanup retention. 0 disables a category. Values can also be
  # overridden at runtime via the system_setting table (see
  # SystemSettingService for keys: cleanup.historyDays etc). Cleanup is
  # fully manual — no cron, no startup trigger.
  retention-history-days: 30
  retention-artifact-days: 30
  retention-execution-days: 30
  # 应用日志保留天数：与 Logback TimeBasedRollingPolicy 的 maxHistory=3 对齐；
  # 0 表示禁用清理（但 Logback 仍按 3 天滚动，不受此值影响）。
  retention-log-days: 3
  # Directory where logback-spring.xml writes the rolling application log.
  # Cleanup will only operate on this directory if it actually exists.
  logs-dir: ./logs

bigdata:
  environment-name: Mock 环境      # shown in the topbar tag

logging:
  level:
    root: INFO
    com.bigdata.scriptbox: INFO