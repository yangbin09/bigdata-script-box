server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: script-box
  datasource:
    url: jdbc:h2:file:./data/db/scriptbox;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: null

scriptbox:
  mock: true                       # dev server has no Kerberos / Hadoop; mock everything
  data-dir: ./data                 # tenant keytabs, scripts, executions
  scripts-dir: ./data/scripts      # uploaded shell scripts
  keytabs-dir: ./data/keytabs      # uploaded keytab files
  executions-dir: ./data/executions
  # V3: 子进程可执行文件。生产部署目标是 FusionInsight Linux，默认 bash 走 PATH；
  # Windows + Git Bash 环境下用 -Pgit-bash profile 覆盖为 C:/gitbash/bash.exe
  # （见 pom.xml 同名 profile）。
  shell-executable: bash
  kinit-executable: kinit          # 租户连通性测试用
  klist-executable: klist
  # V3: 内部短命令（bash -n 语法检查、kinit / klist 连通性测试）的硬超时（秒）。
  # 这些命令不占用 max-concurrent 槽位，但必须有自己的硬超时，避免挂死请求线程。
  command-timeout-seconds: 30
  # 默认执行超时（秒）：脚本未显式声明时的兜底，与 db/schema.sql 的 DEFAULT 600 同步。
  default-timeout-seconds: 600
  # V2: 全局同时执行上限，由 ExecutionGate 的准入许可强制控制。
  max-concurrent: 5
  # V3 (PR-0): 异步执行开关。
  # async-enabled=true 时，POST /api/executions 准入后立即返回 executionId，
  # 真实执行放到独立线程池跑；前端轮询 /state 拿终态。
  # async-enabled=false 时回退到原同步路径（阻塞到完成），用于回滚与老集成测试。
  exec:
    async-enabled: true
    # 异步执行池容量：core-size 始终 2（避免冷启动延迟），max 跟随 max-concurrent。
    runner-pool-size: 5
    runner-queue-size: 64
    runner-name-prefix: exec-runner-
  # V3: 单次执行 stdout / stderr 落盘字节上限。0 表示不限制（不推荐）。
  max-output-bytes: 268435456
  max-log-bytes: 1048576           # 1MB limit per page render
  max-script-bytes: 1048576        # 1MB script upload limit
  max-input-file-bytes: 10485760   # 10MB script parameter file upload limit
  max-artifact-bytes: 52428800     # 50MB per artifact file
  max-artifact-files: 50           # 50 artifacts per execution max
  # 批量执行上限：避免单次批次把 ExecutionGate 槽位打满。覆盖硬编码 MAX_ROWS / 并发 8。
  max-batch-rows: 200
  max-batch-concurrency: 8
  # V2: manual cleanup retention. 0 disables a category. Values can also be
  # overridden at runtime via the system_setting table (see
  # SystemSettingService for keys: cleanup.historyDays etc). Cleanup is
  # fully manual — no cron, no startup trigger.
  retention-history-days: 30
  retention-artifact-days: 30
  retention-execution-days: 30
  # 应用日志保留天数：与 Logback TimeBasedRollingPolicy 的 maxHistory=3 对齐；
  # 0 表示禁用清理（但 Logback 仍按 3 天滚动，不受此值影响）。
  retention-log-days: 3
  # Directory where logback-spring.xml writes the rolling application log.
  # Cleanup will only operate on this directory if it actually exists.
  logs-dir: ./logs

bigdata:
  environment-name: Mock 环境      # shown in the topbar tag

logging:
  level:
    root: INFO
    com.bigdata.scriptbox: INFO